<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Loan Eligibility Chatbot</title>
  <meta name="color-scheme" content="light dark">
  <style>
    body { font-family: Arial,sans-serif; background: #f4f6f8;}
    .container { max-width: 650px; margin: 40px auto; background: #fff; padding: 30px 20px 40px 20px; border-radius: 8px;}
    h2 { text-align: center; color: #1a73e8;}
    #chat-area { min-height: 150px; margin-bottom: 30px;}
    .chat-msg.user { background: #1a73e8; color: #fff; margin: 8px 0 8px auto; text-align: right; padding: 8px 16px; border-radius: 8px 8px 2px 8px; display: inline-block; max-width: 80%;}
    .chat-msg.bot { background: #e2eafd; color: #0a223a; margin: 8px auto 8px 0; text-align: left; padding: 8px 16px; border-radius: 8px 8px 8px 2px; display: inline-block; max-width: 80%;}
    #phone-form {margin:20px 0; text-align:center;}
    #phone-form input {font-size:1.05em; padding:6px; border-radius:5px; border:1px solid #dedede;}
    #phone-form button {font-size:1.05em; background:#1a73e8; color:#fff; border:none; border-radius:4px; padding:7px 13px; margin-left:7px;}
    #user-form { display: flex; gap: 8px; }
    #user-form input[type="text"] { flex: 1; padding: 8px; }
    #user-form button { padding: 8px 14px; background: #222; color: #fff; border-radius: 4px; border:none;}
    .choice-btn { margin-top:6px; margin-right:5px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🏡 Home Loan Basic Eligibility Chatbot</h2>

    <form id="phone-form">
      <label for="phone">Enter your Phone Number:</label>
      <input id="phone" name="phone" type="text" required maxlength="15" />
      <button type="submit">Start</button>
    </form>

    <div id="chat-area"></div>

    <form id="user-form" class="hidden" autocomplete="off">
      <input id="user-input" type="text" placeholder="Type your reply or choose below" autocomplete="off"/>
      <button type="submit">Send</button>
    </form>
    <div id="choices"></div>
  </div>
<script>
let phone = '';
const chatArea = document.getElementById('chat-area');
const phoneForm = document.getElementById('phone-form');
const phoneInput = document.getElementById('phone');
const userForm = document.getElementById('user-form');
const userInput = document.getElementById('user-input');
const choicesDiv = document.getElementById('choices');

// Print as a chat bubble from bot
function appendBotMsg(text) {
  const div = document.createElement('div');
  div.className = 'chat-msg bot';
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}
// Print as a chat bubble from user
function appendUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'chat-msg user';
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

// Start session on phone submit
phoneForm.onsubmit = async (e) => {
  e.preventDefault();
  phone = phoneInput.value.trim();
  if(!phone) return;
  phoneForm.style.display = 'none';
  userForm.classList.remove('hidden');
  appendBotMsg("Type 'loan' to begin your eligibility check.");
};

// User replies by typing or hit the choice
userForm.onsubmit = async (e) => {
  e.preventDefault();
  const msg = userInput.value.trim();
  if(!msg) return;
  appendUserMsg(msg);
  userInput.value = '';
  choicesDiv.innerHTML = '';
  await sendUserMsg(msg);
};

async function sendUserMsg(msg) {
  const payload = { phone: phone, message: msg };
  const resp = await fetch('/webhook', {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const out = await resp.json();
  if (out.reply) {
    appendBotMsg(out.reply);
    // Try to extract choices from reply for buttons
    showChoicesIfAvailable(out.reply);
  }
}

function showChoicesIfAvailable(replyMsg) {
  // Parse numbered choices from the question for quick button clicking
  choicesDiv.innerHTML = '';
  let matched = [...replyMsg.matchAll(/\n(\d+)\.\s([^\n]+)/g)];
  if (matched.length > 0) {
    matched.forEach(([full, idx, val]) => {
      let btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.type = 'button';
      btn.textContent = val.trim();
      btn.onclick = () => {
        appendUserMsg(val.trim());
        choicesDiv.innerHTML = '';
        sendUserMsg(val.trim());
      };
      choicesDiv.appendChild(btn);
    });
  }
}
</script>
</body>
</html>
