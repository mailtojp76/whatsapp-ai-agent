<!DOCTYPE html>

<head>

    body {

    .container {

      background: #fff;

      border-radius: 8px;
    }
    h2 {
      text-align: center;
      color: #1a73e8;
    }
    #chat-area {
      min-height: 150px;
      margin-bottom: 30px;
    }

      color: #fff;
      margin: 8px 0 8px auto;

      border-radius: 8px 8px 2px 8px;

      max-width: 80%;

    .chat-msg.bot {
      background: #e2eafd;
      color: #0a223a;

      padding: 8px 16px;
      border-radius: 8px 8px 8px 2px;
      display: inline-block;
      max-width: 80%;
    }
    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    .options button {
      padding: 9px 18px;
      border: 1px solid #1a73e8;
      background: #fff;
      color: #1a73e8;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin-bottom: 7px;
      transition: background .16s;
    }
    .options button:hover {
      background: #1a73e8;
      color: #fff;
    }
    .hidden { display: none; }
  </style>
</head>

    let answers = {};
    let currentQuestion = 0;

    // ------- DOM Elements -------
    const chatArea = document.getElementById('chat-area');
    const optionsArea = document.getElementById('options-area');

    // ------- Functions -------
    function appendBotMsg(text) {
      const div = document.createElement('div');
      div.className = 'chat-msg bot';
      div.textContent = text;
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }
    function appendUserMsg(text) {
      const div = document.createElement('div');
      div.className = 'chat-msg user';
      div.textContent = text;
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }
    function showQuestion(idx) {
      optionsArea.innerHTML = ''; // Clear previous
      if(idx >= questions.length) {
        appendBotMsg("Thank you! Calculating eligibility...");
        sendToApiViaWebhook(answers).then(res => {
          // Customize handling as per your API's response (expects 'result' field here)
          let msg = (res && res.result) ? res.result : "Your eligibility has been received.";
          appendBotMsg(msg);
          optionsArea.innerHTML = ''; // No more questions
        }).catch(() => {
          appendBotMsg("Failed to connect to the eligibility service.");
        });
        return;
      }
      let q = questions[idx];
      appendBotMsg(q.q);
      let opts = document.createElement('div');
      opts.className = 'options';
      for (let choice of q.choices) {
        let btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = choice;
        btn.onclick = () => {
          appendUserMsg(choice);
          answers[q.key] = choice;
          // Prepare partial answers for the API call (optional, remove if only want to call at end)
          // sendToApi(answers); // <--- If you want to send at each step (optional)
          sendToApiViaWebhook(answers);
          currentQuestion++;
          showQuestion(currentQuestion);
        };
        opts.appendChild(btn);
      }
      optionsArea.appendChild(opts);
    }
